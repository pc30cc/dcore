# Admin panel: a single-page app. Every path that is not a file gets
# index.html (client-side routing); hashed assets are cached for a year,
# index.html and the run-time configuration never. /config.js and
# /config.json are written at start by admin-runtime.sh (the API's address
# is not part of the build). HTML and error responses carry no-transform, so
# a proxy or CDN in front neither injects scripts nor rewrites the markup.

# The assets' caching holds for the file (200, or 304 on revalidation) only:
# any other answer from their location (nginx's 405, 412, 413 or 500 page) is
# an error page, never cached, never rewritten.
map $status $admin_assets_cache {
    ~^(200|304)$ "public, max-age=31536000, immutable";
    default "no-store, no-transform";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/admin-headers.conf;
    # Responses of blocks without headers of their own (nginx's error pages,
    # /healthz): never cached, never rewritten on the way. Not in the snippets:
    # they are included where a location sets its own Cache-Control.
    add_header Cache-Control "no-store, no-transform" always;
    # A 403 (a directory without an index, an unreadable file) would carry
    # its location's Cache-Control: it is answered as a miss.
    error_page 403 = @missing;
    # Every answer is the whole file. nginx decides a byte range after the
    # headers of the whole file are set, so its 416 page would carry them.
    max_ranges 0;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
        default_type application/javascript;
        alias /tmp/runtime/config.js;
    }

    location = /config.json {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
        default_type application/json;
        alias /tmp/runtime/config.json;
    }

    location /assets/ {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control $admin_assets_cache always;
        try_files $uri @missing;
    }

    # A missing asset's (or a bare directory's) 404 page is neither kept for a year nor rewritten.
    location @missing {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri /index.html;
    }
}
