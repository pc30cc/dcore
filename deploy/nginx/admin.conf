# Admin panel: a single-page app. Every path that is not a file gets
# index.html (client-side routing); hashed assets are cached for a year,
# index.html and the run-time configuration never. /config.js and
# /config.json are written at start by admin-runtime.sh (the API's address
# is not part of the build).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/admin-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
        alias /tmp/runtime/config.js;
    }

    location = /config.json {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /tmp/runtime/config.json;
    }

    location /assets/ {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/admin-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
