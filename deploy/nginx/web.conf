# Website: static pages built as directories (/<locale>/<page>/index.html).
# A directory without its trailing slash gets nginx's relative 301 to the
# slashed path; unknown paths get the site's 404 page. HTML and error
# responses carry no-transform, so a proxy or CDN in front neither injects
# scripts nor rewrites the markup.

# The caching of a location's files holds for the file (200, or 304 on
# revalidation) only: any other answer from that location (nginx's 405, 412,
# 413 or 500 page, a directory's 301) is never cached, never rewritten.
map $status $web_assets_cache {
    ~^(200|304)$ "public, max-age=31536000, immutable";
    default "no-store, no-transform";
}
map $status $web_media_cache {
    ~^(200|304)$ "public, max-age=86400";
    default "no-store, no-transform";
}
map $status $web_well_known_cache {
    ~^(200|304)$ "public, max-age=3600";
    default "no-store, no-transform";
}
# Pages: the page itself, its revalidation, the 404 page and a directory's
# slash redirect are the same for every request to the URL and are cached for
# 5 minutes. nginx's own pages that depend on the request (405, 412, 413, 500)
# are never stored under the page's URL.
map $status $web_page_cache {
    ~^(200|301|304|404)$ "public, max-age=300, no-transform";
    default "no-store, no-transform";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/web-headers.conf;
    # Responses of blocks without headers of their own (nginx's error pages,
    # /healthz): never cached, never rewritten on the way. Not in the snippets:
    # they are included where a location sets its own Cache-Control.
    add_header Cache-Control "no-store, no-transform" always;

    error_page 404 /404.html;
    # A directory without an index (/_astro/, /media/, /.well-known/) is a 403
    # inside its location, under that location's Cache-Control: it is a miss
    # like any other, answered by the 404 page from location /.
    error_page 403 =404 /404.html;
    # Every answer is the whole file. nginx decides a byte range after the
    # headers of the whole file are set, so its 416 page would carry them.
    max_ranges 0;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control $web_assets_cache always;
    }

    location /media/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control $web_media_cache always;
    }

    location /.well-known/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control $web_well_known_cache always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Pages, the 404 page (error_page above), the slash redirects.
    location / {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control $web_page_cache always;
    }
}
