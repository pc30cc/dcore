# Website: static pages built as directories (/<locale>/<page>/index.html).
# A directory without its trailing slash gets nginx's relative 301 to the
# slashed path; unknown paths get the site's 404 page. HTML and error
# responses carry no-transform, so a proxy or CDN in front neither injects
# scripts nor rewrites the markup.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/web-headers.conf;
    # Responses of blocks without headers of their own (nginx's error pages,
    # /healthz): never cached, never rewritten on the way. Not in the snippets:
    # they are included where a location sets its own Cache-Control.
    add_header Cache-Control "no-store, no-transform" always;

    error_page 404 /404.html;
    # A directory without an index (/_astro/, /media/, /.well-known/) is a 403
    # inside its location, under that location's Cache-Control: it is a miss
    # like any other, answered by the 404 page from location /.
    error_page 403 =404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /media/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /.well-known/ {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Pages, the 404 page (error_page above), the slash redirects.
    location / {
        include /etc/nginx/snippets/web-headers.conf;
        add_header Cache-Control "public, max-age=300, no-transform" always;
    }
}
