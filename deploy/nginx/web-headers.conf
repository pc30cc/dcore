# Headers of every website response. The deletion page's Google sign-in
# opens a popup that reports back to its opener, so the opener policy keeps
# popups (a stricter same-origin would cut that channel).
include /etc/nginx/snippets/headers.conf;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
include /etc/nginx/snippets/csp.conf;
