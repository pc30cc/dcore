# kv-rt: the realtime server's engine (channel history and presence). Only
# the realtime server connects to it. start.sh appends the password and
# maxmemory.
port 6379
bind 0.0.0.0
protected-mode no
dir /data

# History and presence expire by themselves and may be lost: after a gap
# the app catches up over REST, and presence is refreshed by the next
# connection. Eviction keeps a full instance from refusing publishes.
maxmemory-policy allkeys-lru

appendonly no
save ""

latency-monitor-threshold 100
