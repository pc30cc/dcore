# kv-cache: data that may be evicted and rebuilt (own-account views, cards,
# deck queues, entitlements, presence, last seen, seen filters, match cache).
# A missing key costs one statement or one rebuild, never a wrong answer.
# start.sh appends the password and maxmemory.
port 6379
bind 0.0.0.0
protected-mode no
dir /data

maxmemory-policy allkeys-lru
maxmemory-samples 10

# No persistence and no backups: everything here is derived.
appendonly no
save ""

latency-monitor-threshold 100
slowlog-log-slower-than 10000
