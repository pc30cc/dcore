# kv-core: the instance whose keys must never be evicted: BullMQ queues,
# write-behind streams, rate limits, OTP state, id and job leases, the token
# deny list, version counters, like buckets, unread counts, conversation
# lists, live call state. start.sh appends the password and maxmemory.
#
# Alert when used_memory passes 70% of maxmemory: noeviction refuses every
# write once it is full, which stops chat, calls and every queue.
port 6379
bind 0.0.0.0
protected-mode no
dir /data

# BullMQ requires noeviction; nothing that may be evicted belongs here.
maxmemory-policy noeviction

# Append-only file fsynced every second (at most one second lost on power
# failure) plus one RDB snapshot a day. Copies of both leave the host
# encrypted and are kept at most 7 days: they contain stream entries.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 86400 1

notify-keyspace-events ""
latency-monitor-threshold 100
slowlog-log-slower-than 10000
