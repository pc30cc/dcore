; PgBouncer in transaction mode between the API/worker and PostgreSQL.
; entrypoint.sh replaces the @...@ values and writes the userlist from the
; environment at every start. Migrations and anything that needs session
; state (session advisory locks, SET, LISTEN, WITH HOLD cursors) connect to
; PostgreSQL directly.
[databases]
@PG_DATABASE@ = host=@PG_HOST@ port=@PG_PORT@ dbname=@PG_DATABASE@

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
; Server connections per (database, user): app_api and app_worker each get
; their own pool; max_db_connections caps their sum below PostgreSQL's
; max_connections, leaving room for migrations, backups and psql.
default_pool_size = @DEFAULT_POOL_SIZE@
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = @MAX_CLIENT_CONN@
max_db_connections = @MAX_DB_CONNECTIONS@

; The login roles carry their own timeouts (ALTER ROLE ... SET); clients may
; not send settings as startup parameters, so unknown ones are refused
; instead of being silently dropped.
ignore_startup_parameters = extra_float_digits

; The app's pool sends unnamed statements only (packages/db refuses named
; ones), so no prepared statement is cached here.
max_prepared_statements = 0

; Client-side guards on top of the roles' statement timeouts.
query_wait_timeout = 10
idle_transaction_timeout = 30
server_idle_timeout = 300
server_lifetime = 1800

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
