# LiveKit, single node. start.sh fills the @...@ values from the environment
# and writes the result to /tmp/livekit.yaml at every start.
#
# Ports: 7880 HTTP/WebSocket signalling and server API (behind the reverse
# proxy); the ICE TCP port and the UDP media range are published on the
# host's public address (no HTTP proxy can carry them). The host and
# container port numbers must be equal: LiveKit announces its own.
port: 7880
logging:
  level: info
rtc:
  tcp_port: @TCP_PORT@
  port_range_start: @UDP_START@
  port_range_end: @UDP_END@
@NODE_IP_LINES@
  # Ramp-up on long, lossy paths: send-side bandwidth estimation moves a
  # subscriber up a simulcast layer sooner than REMB, and video is never
  # paused while the estimate is still low at the start of a call.
  congestion_control:
    enabled: true
    allow_pause: false
    use_send_side_bwe: true
  # A layer switch waits for a keyframe: answer keyframe requests sooner.
  pli_throttle:
    low_quality: 200ms
    mid_quality: 500ms
    high_quality: 500ms
  # A deeper video retransmit buffer for NACKs over a long path.
  packet_buffer_size_video: 1000
room:
  # Rooms are created by the API when a call is answered, never by a client:
  # a token kept after its call cannot bring the room back.
  auto_create: false
  empty_timeout: 300
  # A participant who dropped (a network change) has this long to come back.
  departure_timeout: 20
  # Two people, and room for a reconnect replacing a connection.
  max_participants: 4
keys:
  "@API_KEY@": "@API_SECRET@"
webhook:
  api_key: "@API_KEY@"
  urls:
    - "@WEBHOOK_URL@"
turn:
  # LiveKit's own TURN stays off; the in-country relay is a separate server
  # (deploy/relay/), handed to the participants who need it by the API.
  enabled: false
