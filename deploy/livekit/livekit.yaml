# LiveKit, single node. start.sh fills the @...@ values from the environment
# and writes the result to /tmp/livekit.yaml at every start.
#
# Ports: 7880 HTTP/WebSocket signalling and server API (behind the reverse
# proxy); the ICE TCP port and the UDP media range are published on the
# host's public address (no HTTP proxy can carry them). The host and
# container port numbers must be equal: LiveKit announces its own.
port: 7880
logging:
  level: info
rtc:
  tcp_port: @TCP_PORT@
  port_range_start: @UDP_START@
  port_range_end: @UDP_END@
@NODE_IP_LINES@
room:
  # Rooms are created by the API when a call is answered, never by a client.
  auto_create: false
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 2
keys:
  "@API_KEY@": "@API_SECRET@"
webhook:
  api_key: "@API_KEY@"
  urls:
    - "@WEBHOOK_URL@"
turn:
  # LiveKit's own TURN stays off; an in-country relay is a separate service.
  enabled: false
