# The in-country media relay (configure.sh next to this). Goes in
# /etc/systemd/system/coturn.service.d/ before `apt-get install coturn`.
#
# The package enables and starts coturn at install, with the package's own
# /etc/turnserver.conf (no shared secret, no peer limits). This keeps the
# stock unit from starting (systemd skips it; it does not fail) until
# configure.sh has written the relay's configuration and touched
# /etc/relay/ready.
[Unit]
ConditionPathExists=/etc/relay/ready
