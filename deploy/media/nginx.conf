# Media origin: serves objects of the media bucket only for links the API
# signed (verify.js), fetching them from the object store with the origin
# secret the bucket policy asks for. The server block is written at start
# by media-runtime.sh (bucket, store address, secret).
load_module modules/ngx_http_js_module.so;

worker_processes auto;
# Each proxied request holds two descriptors (client and store).
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

# Workers see only the variables named here.
env CDN_SIGNING_KEY;

events {
    worker_connections 2048;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1k;

    js_import verify from /etc/nginx/njs/verify.js;
    js_set $media_ok verify.ok;

    include /tmp/runtime/media.conf;
}
