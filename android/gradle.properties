# Two store flavors, R8 on release and Robolectric on the JVM. Raise it
# deliberately. The Kotlin compile daemon is a separate process with its own
# heap (kotlin.daemon.jvmargs); at the 2g it otherwise inherited it spent 25+
# minutes in full GCs when the four variants compiled at once, so both are 3g.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# preferIPv4Stack above: on some hosts dl.google.com resolves to
# IPv6 and answers 404 over that route, which Gradle reports as
# "Could not find androidx.core:core-ktx:..." and reads like a wrong version.

android.useAndroidX=true
# R classes carry only this module's resources, not its dependencies' as well.
android.nonTransitiveRClass=true
kotlin.code.style=official
