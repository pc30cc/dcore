# Two store flavors, R8 on release and Robolectric on the JVM: 2g is enough
# headroom for compiling, testing and minifying both. Raise it deliberately.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# preferIPv4Stack above: on some hosts dl.google.com resolves to
# IPv6 and answers 404 over that route, which Gradle reports as
# "Could not find androidx.core:core-ktx:..." and reads like a wrong version.

android.useAndroidX=true
# R classes carry only this module's resources, not its dependencies' as well.
android.nonTransitiveRClass=true
kotlin.code.style=official
