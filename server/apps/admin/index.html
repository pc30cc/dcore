<!doctype html>
<html lang="%DEFAULT_LOCALE%" dir="%DEFAULT_DIR%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>%APP_TITLE%</title>
    %BRAND_STYLE%
    <script>
      // Applies the saved theme and the panel's language before the first paint (no flash of the wrong ones):
      // the language picked in the panel's menu, else the deployment's default (/config.js, loaded first).
      (function () {
        var root = document.documentElement;
        var theme = 'system';
        var saved = null;
        try {
          theme = localStorage.getItem('admin.theme') || 'system';
          saved = localStorage.getItem('admin.locale');
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        var locales = %LOCALES%;
        var config = window.__APP_CONFIG__;
        var fallback = config && typeof config.defaultLocale === 'string' ? config.defaultLocale : null;
        var locale = saved && locales.indexOf(saved) !== -1 ? saved : fallback && locales.indexOf(fallback) !== -1 ? fallback : null;
        if (locale) {
          root.lang = locale;
          root.dir = %RTL_LOCALES%.indexOf(locale) !== -1 ? 'rtl' : 'ltr';
          document.title = %TITLES%[locale];
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
