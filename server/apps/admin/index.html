<!doctype html>
<html lang="%DEFAULT_LOCALE%" dir="%DEFAULT_DIR%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>%APP_TITLE%</title>
    %BRAND_STYLE%
    <script>
      // Applies the saved theme and language before the first paint (no flash of the wrong ones).
      (function () {
        var root = document.documentElement;
        var theme = 'system';
        var locale = null;
        try {
          theme = localStorage.getItem('admin.theme') || 'system';
          locale = localStorage.getItem('admin.locale');
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        if (locale && %LOCALES%.indexOf(locale) !== -1) {
          root.lang = locale;
          root.dir = %RTL_LOCALES%.indexOf(locale) !== -1 ? 'rtl' : 'ltr';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
