; PgBouncer for development, in transaction mode: the API's and the worker's
; pools (DATABASE_TARGET=pgbouncer) go through here. Migrations and anything
; that needs session state (advisory locks, SET, LISTEN) connect to
; PostgreSQL directly on 5432.
[databases]
app_dev = host=postgres port=5432 dbname=app_dev
app_test = host=postgres port=5432 dbname=app_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
; Written at container start from APP_DB_PASSWORD (docker-compose.yml).
auth_file = /tmp/userlist.txt

pool_mode = transaction
; Server connections per database/user pair: PostgreSQL pays per backend,
; PgBouncer multiplexes many client connections onto these.
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
max_client_conn = 1000
max_db_connections = 50

; The timeouts the role sets (postgres/init/01-app.sh) apply to every server
; connection. Clients may not send them as startup parameters, so PgBouncer
; refuses unknown ones instead of silently dropping them.
ignore_startup_parameters = extra_float_digits
; Client-side guards on top of the server's statement_timeout.
query_wait_timeout = 10
idle_transaction_timeout = 30
server_idle_timeout = 300
server_lifetime = 1800

; Named prepared statements are refused by the app's pool (packages/db);
; this keeps PgBouncer from caching any.
max_prepared_statements = 0

admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
