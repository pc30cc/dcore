# kv-cache: the Valkey instance for data that may be evicted and rebuilt.
#
# Holds: own-account views (me:*), profile cards (card:*), deck queues
# (deck:*, deckm:*), entitlements (ent:*), presence (pres:*), last seen
# (ls:*), seen filters and the match cache. A missing key costs one
# statement or one rebuild, never a wrong answer.
# API and worker reach it through REDIS_CACHE_URL; unset, they use the
# REDIS_URL instance (development: one instance for both roles).
#
# Start: valkey-server infra/valkey/kv-cache.conf
# Sizing: about 2.8 GB at the planned size; the fixed maxmemory is the cap
# and LRU eviction keeps it there.

bind 127.0.0.1 -::1
protected-mode yes
port 6380

maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# No persistence and no backups: everything here is derived.
appendonly no
save ""

latency-monitor-threshold 100
slowlog-log-slower-than 10000

# Access: as kv-core, one ACL user per process kind on ~app:*.
