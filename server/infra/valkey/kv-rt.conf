# kv-rt: the Valkey instance behind Centrifugo's Redis engine (channel
# history and presence). Only Centrifugo connects to it (its own
# engine.redis.address setting); the API and the worker publish through
# Centrifugo's server API and never open this instance.
#
# Start: valkey-server infra/valkey/kv-rt.conf
# Sizing: about 0.5 GB (100 entries and 15 minutes of history per user
# channel, plus presence).

bind 127.0.0.1 -::1
protected-mode yes
port 6381

maxmemory 1gb
# History and presence expire by themselves and can be lost: after a gap
# the app catches up over REST (sync cursors), and presence is refreshed by
# the next connection. Eviction keeps a full instance from refusing
# publishes. To be confirmed against Centrifugo's own guidance on staging.
maxmemory-policy allkeys-lru

# Centrifugo keeps history across its own restarts; a Valkey restart may
# lose it (no persistence needed for the reasons above).
appendonly no
save ""

latency-monitor-threshold 100
