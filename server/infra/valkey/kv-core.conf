# kv-core: the Valkey instance whose keys must never be evicted.
#
# Holds: BullMQ queues, write-behind streams (wb:*), rate limits (rl:*),
# OTP challenges and limits (otp:*), id generator leases (idgen:*), job
# leases, the token deny list (deny:*), refresh grace (rtg:*), version
# counters (mev:*, cv:*, cfg:v), like buckets, unread counts, conversation
# lists, live call state and the active-day sets (la:*).
# API and worker reach it through REDIS_URL. Every key carries the
# deployment prefix (REDIS_KEY_PREFIX), so one instance can serve several
# environments in development.
#
# Start: valkey-server infra/valkey/kv-core.conf
# Sizing: about 1.8 GB in steady state; alert when used_memory passes 70% of
# maxmemory, well before noeviction starts refusing writes (a refused write
# stops chat, calls and every queue).

bind 127.0.0.1 -::1
protected-mode yes
port 6379

maxmemory 4gb
# BullMQ requires noeviction; a cache must never live here (see kv-cache.conf).
maxmemory-policy noeviction

# Durability: append-only file, fsync every second (at most one second lost
# on power failure), plus one RDB snapshot a day. Copies of both leave the
# host encrypted and are kept at most 7 days: they contain stream entries.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 86400 1
# dir <the data volume of this instance>

# Scripts and BullMQ rely on keyspace order and blocking commands; nothing
# here needs keyspace notifications.
notify-keyspace-events ""
latency-monitor-threshold 100
slowlog-log-slower-than 10000

# Access: one ACL user per process kind, limited to the deployment prefix,
# for example (aclfile /etc/valkey/users.acl):
#   user api    on >... ~app:* &app:* +@all -@dangerous +info
#   user worker on >... ~app:* &app:* +@all -@dangerous +info
#   user default off
# A replica of this instance (replicaof <primary> 6379) is the failover copy.
