# PLACEHOLDER. A minimal single-node LiveKit for development so the stack is
# complete; the real call configuration (TURN, regions, webhooks, room
# defaults) comes when calls are built. API keys come from LIVEKIT_KEYS.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
room:
  empty_timeout: 60
  max_participants: 2
