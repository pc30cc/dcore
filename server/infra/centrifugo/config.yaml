# PLACEHOLDER. Centrifugo is wired into the compose file so the stack is
# complete, but this is not the chat configuration: the real one (channels,
# namespaces, history, presence, proxy settings) comes when chat is built.
# Until then it only accepts connection
# tokens signed with CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY and allows no
# channel subscriptions.
http_server:
  port: 8000
log:
  level: info
client:
  allowed_origins: []
  token:
    # Set from the environment (CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY).
    hmac_secret_key: ''
http_api:
  # Set from the environment (CENTRIFUGO_HTTP_API_KEY).
  key: ''
